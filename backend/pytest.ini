[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pkg_resources.*
addopts = -ra --strict-markers
markers =
    integration: requires a real Postgres via testcontainers
    contract: full-app HTTP contract test
